packages:
  - apps/*

onlyBuiltDependencies:
  - '@posthog/cli'
  - esbuild
  - sharp
  - unrs-resolver

# The resolver imports Zod but omits its peer, otherwise it can use Cafe's lint dependency.
packageExtensions:
  '@hookform/resolvers@5.2.2':
    peerDependencies:
      zod: '^3.25.0 || ^4.0.0'
